# ──────────────────────────────────────────────────────
# docker-compose.yml — PostgreSQL local para desarrollo
#
# Levanta la base de datos en 127.0.0.1:3090 (puerto del front)
# PostgreSQL en puerto 5434 para no chocar con otros proyectos.
#
# Uso:
#   docker compose up -d        # arrancar
#   docker compose down         # parar
#   docker compose down -v      # parar y borrar volumen (reset total)
# ──────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    container_name: tienda-nube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda_nube
    ports:
      - "5434:5432"
    volumes:
      - tienda-nube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_nube"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tienda-nube-db-data:
